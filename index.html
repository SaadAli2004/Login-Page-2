<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
      }

      h2,
      input,
      input::placeholder,
      i,
      p,
      a {
        color: black;
      }

      a {
        text-decoration: none;
      }

      .container {
        width: 100%;
        height: 100vh;
        background: grey;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container .login {
        display: flex;
        width: 65%;
        border-radius: 20px;
        overflow: hidden;
      }

      .container .intro {
        width: 50%;
        padding: 30px 20px;
        background: #fea41a;
        text-align: center;
        display: flex;
        gap: 0.5rem;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          45deg,
          rgba(254, 164, 26, 1) 0%,
          rgba(253, 87, 73, 1) 100%
        );
      }

      .intro h1,
      .intro i,
      .intro p {
        color: white;
      }
      .container .intro > i {
        font-size: 1.5rem;
      }
   .container .intro > p{
    font-size: .9rem;
    margin-block:10px 20px;
   }
      .container .intro button {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 10px 20px;
        border-radius: 150px;
        background-color: transparent;
        border: 1px solid white;
      }
      .container .intro h1 {
        font-size: 2rem;
        font-weight: 700;
      }
      .container form {
        width: 50%;
        background-color: white;
        padding: 30px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .container form h2 {
        font-size: 1.8rem;
        margin-bottom: 10px;
      }

      .container .social-icons {
        display: flex;
        justify-content: center;
        gap: 1.2rem;
      }

      .container .social-icons i {
        font-size: 1.5rem;
      }

      .container form .input-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .container form .input-container input {
        border: none;
        background-color: lightgray;
        padding: 10px;
        outline-color: black;
        width: 100%;
      }

      .container form .links {
        display: flex;
        margin-block: 10px;
        gap: 0.2rem;
      }

      .container form .links div {
        display: flex;
        align-items: center;
      }

      .container form button {
        border: 2px solid #ff4c2d;
        background-color: #ff4c2d;
        color: white;
        font-weight: bold;
        letter-spacing: 2px;
        padding: 10px;
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="login">
        <div class="intro">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <h1>Welcome Back!</h1>
          <p>To keep connected with us please login with your personal info</p>

          <button>
            <i class="fa-solid fa-arrow-left"></i>
            <p>LOG IN</p>
          </button>
        </div>
        <form>
          <h2>Sign Up</h2>
          <div class="social-icons">
            <i class="fa-brands fa-facebook-f"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-github"></i>
            <i class="fa-brands fa-linkedin-in"></i>
          </div>
          <div class="input-container">
            <input type="text" placeholder="name" />
            <input type="text" placeholder="email" />
            <input type="password" placeholder="password" />
          </div>

          <div class="links">
            <input type="checkbox" />
            <p>Remember Me</p>
          </div>
          <button type="submit">REGISTER</button>
        </form>
      </div>
    </div>
  </body>
</html>
